<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management System</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-high: #f43f5e;
      --badge-mid: #38bdf8;
      --badge-low: #10b981;
      --terminal-bg: #030712;
      --terminal-text: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 160px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
      color: #ffffff;
    }

    button.secondary-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    button.secondary-btn:hover {
      background: #334155;
      color: var(--text);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .metric-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
    }

    .metric-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-val {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge-Premium {
      background: rgba(244, 63, 94, 0.2);
      color: var(--badge-high);
      border: 1px solid var(--badge-high);
    }

    .badge-Standard {
      background: rgba(56, 189, 248, 0.2);
      color: var(--badge-mid);
      border: 1px solid var(--badge-mid);
    }

    .badge-Budget {
      background: rgba(16, 185, 129, 0.2);
      color: var(--badge-low);
      border: 1px solid var(--badge-low);
    }

    .terminal-container {
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--terminal-text);
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .terminal-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-err {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Inventory System & Analytics</h1>
      <p class="subtitle">Live browser environment execution</p>
    </header>

    <!-- Product Input Section -->
    <div class="card">
      <h2>Add Product</h2>
      <div class="form-row">
        <input type="text" id="itemName" placeholder="Product name (e.g. Monitor)">
        <input type="number" id="itemPrice" placeholder="Product price (e.g. 150)">
        <button id="addBtn">Add to Inventory</button>
        <button id="promptBtn" class="secondary-btn">Use Prompt Mode</button>
      </div>
    </div>

    <!-- Analytics Cards -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Total Inventory Value</div>
        <div class="metric-val" id="totalValDisplay">$0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Affordable Items (&lt; $200)</div>
        <div class="metric-val" id="affordableDisplay" style="font-size: 1rem; margin-top: 8px; color: var(--text);">None</div>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="card">
      <h2>Current Inventory Roster</h2>
      <table>
        <thead>
          <tr>
            <th>PRODUCT NAME</th>
            <th>PRICE</th>
            <th>TIER CATEGORY</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody"></tbody>
      </table>
    </div>

    <!-- Live Execution Terminal -->
    <div>
      <div class="terminal-title">Simulated Console Output</div>
      <div class="terminal-container" id="terminalOutput"></div>
    </div>
  </div>

  <script>
    // Terminal Log Mirror
    const term = document.getElementById("terminalOutput");
    function appendLog(msg, isError = false) {
      const line = document.createElement("div");
      if (isError) line.className = "log-err";
      line.textContent = msg;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    appendLog("---Initializing Inventory System---");

    // Base inventory list
    const inventory = [
      { name: "Laptop", price: 800 },
      { name: "Mouse", price: 25 }
    ];

    // Dynamic Badge Categorization Function
    const getCategoryBadge = (price) => {
      let tier = "";
      if (price >= 500) {
        tier = "HIGH";
      } else if (price >= 100) {
        tier = "MID";
      } else {
        tier = "LOW";
      }

      switch (tier) {
        case "HIGH":
          return "Premium";
        case "MID":
          return "Standard";
        case "LOW":
        default:
          return "Budget";
      }
    };

    // Analytics Function
    function calculateTotalValue(items) {
      let total = 0;
      for (let i = 0; i < items.length; i++) {
        if (!items[i].price) continue;
        total += items[i].price;
      }
      return total;
    }

    // Refresh UI & Run Console Operations
    function updateSystem() {
      const tbody = document.getElementById("inventoryTableBody");
      tbody.innerHTML = "";

      appendLog("---Processing Inventory Roster (forEach)---");
      inventory.forEach(item => {
        const category = getCategoryBadge(item.price);
        appendLog(`* Item: ${item.name} ($${item.price}) -> Category: ${category}`);

        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td>$${item.price}</td>
          <td><span class="badge badge-${category}">${category}</span></td>
        `;
        tbody.appendChild(row);
      });

      appendLog("---Financial Analytics---");
      const totalValue = calculateTotalValue(inventory);
      appendLog(`Total Inventory Value: $${totalValue}`);
      document.getElementById("totalValDisplay").textContent = `$${totalValue}`;

      const affordableItemNames = inventory
        .filter(item => item.price < 200)
        .map(item => item.name);
      appendLog(`Filtered Affordable Items (Under $200): ${JSON.stringify(affordableItemNames)}`);
      document.getElementById("affordableDisplay").textContent = affordableItemNames.join(", ") || "None";

      const formattedReport = inventory.map(
        item => `${item.name.toUpperCase()}: $${item.price}`
      );
      appendLog(`Formatted Report List: ${JSON.stringify(formattedReport)}`);
    }

    // Add item handler
    function processAddition(name, priceInput) {
      const convertedPrice = Number(priceInput);

      if (!name || isNaN(convertedPrice) || convertedPrice <= 0) {
        console.error("Invalid product data provided.");
        appendLog("Invalid product data provided.", true);
        return;
      }

      appendLog(`[Executed: User adds "${name}" at "$${convertedPrice}"]`);
      inventory.push({ name: name, price: convertedPrice });
      updateSystem();
    }

    // Event Listeners
    document.getElementById("addBtn").addEventListener("click", () => {
      const nameInput = document.getElementById("itemName");
      const priceInput = document.getElementById("itemPrice");
      processAddition(nameInput.value.trim(), priceInput.value);
      nameInput.value = "";
      priceInput.value = "";
    });

    document.getElementById("promptBtn").addEventListener("click", () => {
      const inputName = prompt("Enter product name:", "Monitor");
      const inputPrice = prompt("Enter product price:", "150");
      processAddition(inputName, inputPrice);
    });

    // Initial render
    updateSystem();
  </script>
</body>
</html>
